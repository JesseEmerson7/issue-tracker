<!doctype html>
<html><head><title>New Ticket</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>Create Support Ticket</h1>
<form method="post" action="/tickets">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Name <input name="requesterName" maxlength="255" required></label>
<label>Email <input name="email" type="email" maxlength="255" required></label>
<label>Category <select name="category" required><option>Software</option><option>Network</option><option>Account</option><option>Other</option></select></label>
<label>Description <textarea name="description" maxlength="4000" required></textarea></label>
<button>Create</button></form><p><a href="/tickets">Back</a></p></main></body></html>
