<!doctype html><html><head><title>Support Tickets</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>Support Tickets</h1><p><a href="/tickets/new">Create ticket</a></p><form method="get" action="/tickets"><label>Search <input name="q" th:value="${q}"></label><button>Search</button></form><table><thead><tr><th>ID</th><th>Requester</th><th>Category</th><th>Status</th></tr></thead><tbody><tr th:each="t:${tickets}"><td><a th:href="@{/tickets/{id}(id=${t.id})}" th:text="${t.id}"></a></td><td th:text="${t.requesterName}"></td><td th:text="${t.category}"></td><td th:text="${t.status}"></td></tr></tbody></table></main></body></html>
