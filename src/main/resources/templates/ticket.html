<!doctype html><html><head><title>Ticket</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>Ticket <span th:text="${ticket.id}"></span></h1><dl><dt>Requester</dt><dd th:text="${ticket.requesterName}"></dd><dt>Email</dt><dd th:text="${ticket.email}"></dd><dt>Category</dt><dd th:text="${ticket.category}"></dd><dt>Description</dt><dd th:text="${ticket.description}"></dd><dt>Status</dt><dd th:text="${ticket.status}"></dd></dl><form th:action="@{/tickets/{id}/status(id=${ticket.id})}" method="post"><select name="status"><option>OPEN</option><option>IN_PROGRESS</option><option>CLOSED</option></select><button>Change status</button></form><p><a href="/tickets">Back</a></p></main></body></html>
